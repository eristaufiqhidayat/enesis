name: CI

on:
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, ctype, fileinfo, tokenizer, xml
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependensi Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install dependensi npm
        run: npm ci

      - name: Build assets frontend
        run: npm run build

      - name: Siapkan file .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Cek code style (Pint)
        run: vendor/bin/pint --test

      - name: Jalankan test suite
        run: composer test
